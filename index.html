<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>EcoDex</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f120e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#12140f;
  --card:#1c2118;
  --card2:#242b1f;
  --border:#2e3628;
  --text:#e8efe0;
  --muted:#8a9680;
  --green:#3d9a4a;
  --green-dim:#2a6b34;
  --green-glow:#4caf50;
  --orange:#e07a4a;
  --orange-hover:#f08a5a;
  --rare:#d4a017;
  --epic:#b57edc;
  --radius:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  overflow:hidden;
}
.app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px 8px;flex-shrink:0}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#1a3a1f,#0d1f12);display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid var(--border)}
.topbar h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.3px}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:1px}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 16px 100px}
.view{display:none}.view.active{display:block}
.xp-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin:8px 0 14px}
.xp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.xp-rank{color:var(--green-glow);font-weight:700;font-size:15px}
.xp-nums{font-size:13px;color:var(--muted)}
.xpbar{height:6px;background:#2a3226;border-radius:99px;overflow:hidden}
.xpbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--green-dim),var(--green-glow));border-radius:99px;width:0%;transition:width .35s ease}
.xp-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted)}
.search{width:100%;padding:12px 14px 12px 40px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;outline:none;margin-bottom:12px}
.search:focus{border-color:var(--green)}
.search-wrap{position:relative}
.search-wrap::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--border);background:var(--card2);color:var(--muted);padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s}
.chip.active{background:var(--green);color:#fff;border-color:var(--green-dim);font-weight:600}
.chip.region{font-size:12px;padding:6px 12px}
.btn-scan{display:block;width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(160deg,var(--orange-hover),var(--orange));color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(224,122,74,.35);margin-bottom:16px}
.btn-scan:active{transform:scale(.98)}
.btn{display:block;width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin:6px 0;text-align:center}
.btn.primary{background:var(--green);border-color:var(--green-dim);color:#fff}
.btn:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 6px 12px;text-align:center;cursor:pointer;position:relative;min-height:118px;transition:border-color .15s}
.card:active{border-color:var(--green)}
.card.locked{cursor:default;opacity:.9}
.card .num{font-size:10px;color:var(--muted);letter-spacing:.5px;margin-bottom:4px}
.card .sprite{font-size:36px;line-height:1.1}
.card.locked .sprite{filter:grayscale(1) brightness(.3);opacity:.95}
.card .name{font-size:11px;margin-top:6px;line-height:1.25;color:var(--text);font-weight:500}
.card.locked .name{color:var(--muted)}
.card .tag{position:absolute;top:6px;right:6px;font-size:9px;padding:2px 5px;border-radius:6px;background:#2a3226;color:var(--muted);font-weight:600}
.card .tag.rare{background:#3a3010;color:var(--rare)}
.card .tag.epique{background:#2e1f3a;color:var(--epic)}
.card .thumb{width:100%;max-height:40px;object-fit:cover;border-radius:6px;margin-top:4px}
.video-box{position:relative;border-radius:16px;overflow:hidden;background:#0a0c08;border:1px solid var(--border);min-height:220px;margin-bottom:12px}
video,#previewImg{width:100%;display:block;min-height:220px;object-fit:cover}
#previewImg{display:none}
.cap-btn{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:var(--orange);cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.cap-btn::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.demo-row{display:flex;flex-wrap:wrap;gap:8px}
.demo-btn{flex:1;min-width:70px;padding:10px 6px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:12px;cursor:pointer;font-family:inherit;text-align:center}
.file-input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:13px;margin-bottom:8px}
.result.warn{border-color:#5a3a20;background:#2a1e12}
.result.ok{border-color:var(--green-dim);background:#152018}
.result img{max-width:100%;border-radius:10px;margin-bottom:8px}
.big-sprite{font-size:56px;text-align:center;margin:8px 0}
.detail-hero{display:flex;gap:14px;align-items:flex-start}
.detail-hero .big{font-size:64px;line-height:1}
.detail-hero .info{flex:1}
.detail-hero .info h2{margin:0 0 4px;font-size:18px}
.sci{font-size:13px;color:var(--muted);font-style:italic}
.stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.stat-row:last-child{border-bottom:none}
.stat-row span{color:var(--muted)}
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center;font-size:12px}
.badge.off{opacity:.4;filter:grayscale(1)}
.badge .ico{font-size:28px;display:block;margin-bottom:6px}
.badge strong{display:block;margin-bottom:2px;font-size:13px}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(20px + var(--safe-b));z-index:30;width:58px;height:58px;border-radius:50%;border:none;background:linear-gradient(160deg,var(--orange-hover),var(--orange));color:#fff;font-size:24px;cursor:pointer;box-shadow:0 6px 24px rgba(224,122,74,.45);display:flex;align-items:center;justify-content:center}
.fab.hidden{display:none}
.back-btn{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;font-family:inherit;padding:4px 0;margin-bottom:4px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:24px;color:var(--muted);font-size:14px;grid-column:1/-1}
.section-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:4px 0 10px;font-weight:600}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar">
    <div class="logo">🌿</div>
    <div style="flex:1">
      <h1>EcoDex</h1>
      <div class="sub"><span id="hdrRank">Observateur</span> · <span id="hdrCount">0</span>/<span id="hdrTotal">0</span></div>
    </div>
    <button type="button" class="chip" id="btnProfil" onclick="navigate('profil')" style="padding:8px 12px">🏅</button>
  </header>

  <div class="screen" id="screen">
    <section id="home" class="view active">
      <div class="xp-card">
        <div class="xp-row">
          <span class="xp-rank" id="rankName">Observateur</span>
          <span class="xp-nums"><span id="xpText">0</span> / <span id="xpNeed">50</span> XP</span>
        </div>
        <div class="xpbar"><span id="xpbar"></span></div>
        <div class="xp-meta">
          <span id="guideCount">0 / 0 du guide</span>
          <span id="regionHint">📍 —</span>
        </div>
      </div>
      <div class="search-wrap">
        <input class="search" id="searchInput" type="search" placeholder="Chercher une espèce" oninput="renderGrid()">
      </div>
      <div class="chips" id="catChips">
        <button type="button" class="chip active" data-cat="all" onclick="setCat('all',this)">Tous</button>
        <button type="button" class="chip" data-cat="mammifere" onclick="setCat('mammifere',this)">Mammifères</button>
        <button type="button" class="chip" data-cat="oiseau" onclick="setCat('oiseau',this)">Oiseaux</button>
        <button type="button" class="chip" data-cat="insecte" onclick="setCat('insecte',this)">Insectes</button>
        <button type="button" class="chip" data-cat="amphibien" onclick="setCat('amphibien',this)">Autres</button>
      </div>
      <div class="section-title">🗺️ Zones</div>
      <div class="chips" id="regChips">
        <button type="button" class="chip region active" data-reg="all" onclick="setReg('all',this)">Toutes</button>
        <button type="button" class="chip region" data-reg="local" onclick="setReg('local',this)">📍 Près de moi</button>
        <button type="button" class="chip region" data-reg="nord" onclick="setReg('nord',this)">Nord</button>
        <button type="button" class="chip region" data-reg="ouest" onclick="setReg('ouest',this)">Ouest</button>
        <button type="button" class="chip region" data-reg="est" onclick="setReg('est',this)">Est</button>
        <button type="button" class="chip region" data-reg="centre" onclick="setReg('centre',this)">Centre</button>
        <button type="button" class="chip region" data-reg="sud_ouest" onclick="setReg('sud_ouest',this)">Sud-Ouest</button>
        <button type="button" class="chip region" data-reg="sud_est" onclick="setReg('sud_est',this)">Sud-Est</button>
        <button type="button" class="chip region" data-reg="mediterranee" onclick="setReg('mediterranee',this)">Méditerranée</button>
        <button type="button" class="chip region" data-reg="alpes" onclick="setReg('alpes',this)">Alpes</button>
      </div>
      <div class="chips" style="margin-bottom:14px">
        <button type="button" class="chip active" id="cfAll" onclick="setCaught('all')">Toutes</button>
        <button type="button" class="chip" id="cfCaught" onclick="setCaught('caught')">Capturées</button>
        <button type="button" class="chip" id="cfMissing" onclick="setCaught('missing')">Manquantes</button>
      </div>
      <button type="button" class="btn-scan" id="mainScanBtn" onclick="navigate('scan')">Scanner ta première espèce</button>
      <div class="grid" id="grid"></div>
    </section>

    <section id="scan" class="view">
      <button type="button" class="back-btn" onclick="goHome()">← Retour</button>
      <div class="section-title" style="margin-top:0">Mode scan</div>
      <div class="video-box">
        <video id="video" playsinline muted autoplay></video>
        <img id="previewImg" alt="aperçu">
        <button type="button" class="cap-btn" id="capBtn" title="Capturer" onclick="capture()"></button>
      </div>
      <div class="panel">
        <h3>Importer depuis la galerie</h3>
        <input type="file" class="file-input" id="fileInput" accept="image/*">
        <button type="button" class="btn primary" id="identifyBtn" onclick="pickFile()">Identifier l'image</button>
      </div>
      <div class="panel">
        <h3>Exemples hors-ligne</h3>
        <div class="demo-row">
          <button type="button" class="demo-btn" onclick="registerDemo('hedgehog')">🦔 Hérisson</button>
          <button type="button" class="demo-btn" onclick="registerDemo('blue_tit')">🐦 Mésange</button>
          <button type="button" class="demo-btn" onclick="registerDemo('ladybird')">🐞 Coccinelle</button>
          <button type="button" class="demo-btn" onclick="registerDemo('chamois')">🐐 Chamois</button>
        </div>
      </div>
      <div id="scanResult" class="panel result" style="display:none"></div>
      <p class="note">Espèces rares = plus d’XP · bonus si espèce de ta région</p>
    </section>

    <section id="detail" class="view">
      <button type="button" class="back-btn" onclick="goHome()">← Collection</button>
      <div class="panel" id="detailBox"></div>
    </section>

    <section id="profil" class="view">
      <button type="button" class="back-btn" onclick="goHome()">← Retour</button>
      <div class="section-title" style="margin-top:0">Profil & badges</div>
      <div class="xp-card">
        <div class="xp-row">
          <span class="xp-rank" id="pRank">Observateur</span>
          <span class="xp-nums">Niv. <span id="pLevel">1</span></span>
        </div>
        <div class="xpbar"><span id="pXpbar"></span></div>
        <div class="xp-meta">
          <span><span id="pXpText">0</span> / <span id="pXpNeed">50</span> XP</span>
          <span id="pRegion">📍 —</span>
        </div>
        <div class="stat-row" style="margin-top:10px"><span>Espèces découvertes</span><strong id="pCount">0</strong></div>
        <div class="stat-row"><span>Badges débloqués</span><strong id="pBadges">0</strong></div>
      </div>
      <div class="section-title">Badges</div>
      <div class="badge-grid" id="badgeGrid"></div>
    </section>
  </div>
  <button type="button" class="fab" id="fab" title="Scanner" onclick="navigate('scan')">📷</button>
</div>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
